name: Bug report
description: Something does not work as expected.
labels:
  - bug
title: "[bug] "
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: Say what you did and what you saw.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: The command or steps, if you know them.
    validations:
      required: false
  - type: input
    id: version
    attributes:
      label: muslim version
      description: Shown by `/muslim`.
    validations:
      required: true
  - type: dropdown
    id: surface
    attributes:
      label: Surface
      options:
        - terminal
        - desktop
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - macOS
        - Windows
        - Linux
    validations:
      required: true
