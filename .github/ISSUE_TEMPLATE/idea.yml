name: New feature
description: Ask for a new feature.
labels:
  - idea
title: "[new feature] "
body:
  - type: textarea
    id: feature_idea
    attributes:
      label: What is the new feature?
      description: Rough is fine.
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Why?
      description: What are you trying to do?
    validations:
      required: false
  - type: dropdown
    id: feature
    attributes:
      label: Feature
      options:
        - thikr
        - athkar
        - salah
        - quran
        - Muslim pane
        - /muslim commands and settings
        - other or new
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: muslim version
      description: Shown by `/muslim`.
    validations:
      required: true
  - type: dropdown
    id: surface
    attributes:
      label: Surface
      options:
        - terminal
        - desktop
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - macOS
        - Windows
        - Linux
    validations:
      required: true
