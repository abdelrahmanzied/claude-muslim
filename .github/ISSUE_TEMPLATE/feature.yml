name: Feature request
description: Ask for something new.
labels:
  - enhancement
title: "[feature] "
body:
  - type: textarea
    id: want
    attributes:
      label: What would you like?
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Why do you want it?
      description: What are you trying to do?
    validations:
      required: false
  - type: input
    id: version
    attributes:
      label: muslim version
      description: Shown by `/muslim`.
    validations:
      required: true
  - type: dropdown
    id: surface
    attributes:
      label: Surface
      options:
        - terminal
        - desktop
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - macOS
        - Windows
        - Linux
    validations:
      required: true
