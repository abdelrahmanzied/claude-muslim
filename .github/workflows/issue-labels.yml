# An issue form's static `labels:` holds only its kind label. This adds the feature and
# surface labels from the form's answers. It only adds; anything not in a map is ignored.
# Keep the maps in step with the dropdowns in .github/ISSUE_TEMPLATE/ and plugin/src/feedback.ts.
name: Issue labels

on:
  issues:
    types: [opened, edited]

permissions:
  issues: write

jobs:
  label:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const maps = {
              Feature: {
                'thikr': 'thikr',
                'athkar': 'athkar',
                'salah': 'salah',
                'quran': 'quran',
                'Muslim pane': 'pane',
                '/muslim commands and settings': 'muslim',
              },
              Surface: {
                'terminal': 'terminal',
                'desktop': 'desktop',
              },
            }
            const body = context.payload.issue.body || ''
            const labels = []
            for (const [section, map] of Object.entries(maps)) {
              const found = body.match(new RegExp(`### ${section}\\s*\\n+([^\\n]*)`))
              const label = found && map[found[1].trim()]
              if (label) labels.push(label)
            }
            if (labels.length) {
              await github.rest.issues.addLabels({ ...context.repo, issue_number: context.issue.number, labels })
            }
